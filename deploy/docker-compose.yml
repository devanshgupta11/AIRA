# Build and run the AIRA image locally, exactly as a cloud platform would.
#
# The point of this file is to make the deployment testable before it is deployed: if this works,
# the same image works on any platform that can run a container and route a port. Run it from the
# repository root so the build context contains backend/ and qdrant/:
#
#     docker compose -f deploy/docker-compose.yml up --build
#     -> http://localhost:8010
#
# Port 8010, not 8000, so this never collides with the real backend running on the laptop.

services:
  aira:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aira-console:latest
    container_name: aira-console
    ports:
      - "8010:8000"
    environment:
      # Archive: serve the recorded investigations, and say plainly that the monitored stack is
      # not part of this deployment. Set to "full" only where Prometheus, Ollama, the MCP server
      # and the RCA agent are all actually reachable from inside the container.
      AIRA_MODE: archive
      PORT: "8000"
    # Qdrant runs embedded and holds an exclusive lock on its directory, so this service must
    # never be scaled beyond one replica. Two would fight over the same file and one would fail
    # to start - loudly, by design, but still a failure.
    deploy:
      replicas: 1
    restart: unless-stopped
