# AIRA alert rules for the OpenTelemetry Demo.
# Only metric names discovered in the running stack are used (docs/environment-discovery.md):
#   traces_span_metrics_calls_total            span metrics (collector span_metrics connector, every 15s)
#   container_cpu_usage_nanoseconds_total      docker_stats receiver, cumulative CPU time, every 10s
#   container_memory_usage_total_bytes         docker_stats receiver, every 10s
# Every alert carries: service_name, severity, aira_signal, plus summary/description annotations.

groups:
  - name: aira-service-health
    interval: 15s
    rules:
      # Errors across all requests a service serves (server spans). Long-lived gRPC streams
      # (*/EventStream, e.g. flagd) are excluded: they end with an error status whenever a client
      # disconnects, which caused a false AiraOperationFailing/flagd alert on 2026-10-06.
      # Catches faults that hit a meaningful share of a service's traffic (e.g. productCatalogFailure,
      # paymentFailure) and the cascade into callers (checkout, frontend).
      - alert: AiraHighErrorRate
        expr: |
          (
            sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", span_name!~".*/EventStream"}[3m]))
            /
            sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", span_name!~".*/EventStream"}[3m]))
          ) > 0.05
          and
          sum by (service_name) (increase(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", span_name!~".*/EventStream"}[3m])) >= 3
        for: 30s
        # Low-traffic services (payment ~0.06 req/s) saw only ~7 requests in a 2m window, so the
        # ">= 3 errors" guard kept dropping below its threshold and the alert flapped, creating
        # duplicate incidents for one continuous fault (observed 2026-10-06, incidents #14-#19).
        # A 3m window holds more requests, and keep_firing_for bridges any remaining gap.
        keep_firing_for: 2m
        labels:
          severity: critical
          aira_signal: error_rate
        annotations:
          summary: "High error rate on {{ $labels.service_name }}"
          description: "{{ $labels.service_name }}: {{ $value | humanizePercentage }} of server requests failed over the last 3 minutes (threshold 5%)."

      # A single operation failing most of the time. Needed because some faults break one
      # low-traffic operation (cartFailure only breaks EmptyCart, ~3% of all cart calls).
      - alert: AiraOperationFailing
        expr: |
          (
            sum by (service_name, span_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", span_name!~".*/EventStream"}[3m]))
            /
            sum by (service_name, span_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", span_name!~".*/EventStream"}[3m]))
          ) > 0.5
          and
          sum by (service_name, span_name) (increase(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR", span_name!~".*/EventStream"}[3m])) >= 2
        for: 30s
        # Same anti-flapping guard as above; this rule proved stable in testing, but the services it
        # watches are the low-traffic ones, so keep it symmetric.
        keep_firing_for: 2m
        labels:
          severity: critical
          aira_signal: operation_errors
        annotations:
          summary: "Operation {{ $labels.span_name }} failing on {{ $labels.service_name }}"
          description: "{{ $labels.service_name }} / {{ $labels.span_name }}: {{ $value | humanizePercentage }} of calls failed over the last 3 minutes (threshold 50%)."

      # Sustained container CPU, as percent of one core, from the cumulative CPU-time counter.
      # (container_cpu_utilization_ratio is NOT used: with adHighCpu on, the counter showed ad at
      # 3.99 cores while that gauge crept up ~2.5 points per sample, so it lags badly.)
      # Baseline peaks were 15-50%; adHighCpu drives ad to ~400%.
      # load-generator is excluded: it drives a headless browser and is not part of the application.
      - alert: AiraHighCpu
        expr: |
          label_replace(
            rate(container_cpu_usage_nanoseconds_total{container_name!="load-generator"}[1m]) / 1e9 * 100,
            "service_name", "$1", "container_name", "(.*)"
          ) > 100
        for: 30s
        labels:
          severity: warning
          aira_signal: cpu
        annotations:
          summary: "High CPU on {{ $labels.service_name }}"
          description: "{{ $labels.service_name }} container used {{ $value | printf \"%.0f\" }}% CPU over the last minute (100% = one full core; threshold 100%)."

      # Service stopped. Demo services push telemetry over OTLP, so there is no `up` metric.
      # The docker_stats receiver reports every running container every 10s; a container that
      # reported during the last 30 minutes but not during the last 45 seconds has stopped
      # (or been removed). Limitation: after 30 minutes down the alert resolves on its own.
      - alert: AiraServiceDown
        expr: |
          label_replace(
            count by (container_name) (count_over_time(container_memory_usage_total_bytes[30m]))
            unless
            count by (container_name) (count_over_time(container_memory_usage_total_bytes[45s])),
            "service_name", "$1", "container_name", "(.*)"
          )
        for: 15s
        labels:
          severity: critical
          aira_signal: availability
        annotations:
          summary: "{{ $labels.service_name }} is down"
          description: "No container metrics from {{ $labels.service_name }} for over 45 seconds, although it was running within the last 30 minutes. The container has stopped or been removed."

      # Latency, judged against the service's own recent past rather than a fixed number.
      #
      # An absolute threshold cannot work here. Measured on 2026-10-25 with every fault cleared,
      # checkout/PlaceOrder sits at the top histogram bucket (15000 ms) permanently - it fans out
      # to payment, shipping, email and currency, so it is simply the slowest operation in the
      # demo - while every other service sits between 1.9 ms and 42 ms. Any threshold low enough
      # to catch a 5-second slowdown on shipping (normally 6.5 ms) would fire on checkout forever.
      # Comparing each service to itself 15 minutes ago handles both: a service that is always
      # slow has a ratio of 1, and one that just got slow has a large one.
      #
      # The 500 ms floor stops a service going from 1.9 ms to 6 ms raising a page, and the traffic
      # guard keeps a service with almost no requests from alerting on one unlucky span.
      # Limitation: for the first 15 minutes after a cold start there is no baseline, so this rule
      # cannot fire. AiraServiceDown has the same shape of dependency on history.
      - alert: AiraHighLatency
        expr: |
          (
            histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", service_name!~"aira-.*", span_name!~".*/EventStream"}[3m])))
            /
            histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", service_name!~"aira-.*", span_name!~".*/EventStream"}[10m] offset 15m)))
          ) > 3
          and
          histogram_quantile(0.95, sum by (service_name, le) (rate(traces_span_metrics_duration_milliseconds_bucket{span_kind="SPAN_KIND_SERVER", service_name!~"aira-.*", span_name!~".*/EventStream"}[3m]))) > 500
          and
          sum by (service_name) (rate(traces_span_metrics_calls_total{span_kind="SPAN_KIND_SERVER", service_name!~"aira-.*"}[3m])) > 0.02
        for: 30s
        keep_firing_for: 2m
        labels:
          severity: warning
          aira_signal: latency
        annotations:
          summary: "Latency rose sharply on {{ $labels.service_name }}"
          description: "{{ $labels.service_name }}: p95 server latency is {{ $value | printf \"%.1f\" }}x its level 15 minutes ago and above 500 ms."

      # Memory growth, also relative, and for the same reason: this stack idles close to its
      # limits. Measured on 2026-10-25 with no fault injected, kafka sat at 94.2% of its limit,
      # opensearch at 89.9% and accounting at 83.5%. A rule that fires above 80% of limit would
      # page on three healthy infrastructure containers before any application fault occurred.
      # Growth against the container's own baseline is what distinguishes a leak from a service
      # that simply runs full, and the 75% floor keeps a container that doubles from 2% to 4% of
      # a large limit out of it.
      #
      # Both numbers are measured, not chosen. With emailMemoryLeak running, email reached 1.484x
      # its 15-minute baseline at 91.8% of its limit; every other container above 75% of limit was
      # flat (grafana 1.007x, astronomy-db 1.005x, fraud-detection 1.004x, ad 1.002x) and the next
      # fastest grower anywhere was load-generator at 1.086x and only 40% of its limit. 1.25 sits
      # in the empty gap between 1.086 and 1.484. An earlier 1.5 threshold missed the real leak by
      # 0.014 while email sat at 92% of its limit - a miss that mattered, since that is the point
      # at which the container is about to be killed.
      - alert: AiraMemoryGrowth
        expr: |
          label_replace(
            (
              sum by (container_name) (container_memory_usage_total_bytes)
              /
              sum by (container_name) (avg_over_time(container_memory_usage_total_bytes[10m] offset 15m))
            ) > 1.25
            and
            (
              100 * sum by (container_name) (container_memory_usage_total_bytes)
              /
              sum by (container_name) (container_memory_usage_limit_bytes)
            ) > 75,
            "service_name", "$1", "container_name", "(.*)"
          )
        for: 60s
        keep_firing_for: 2m
        labels:
          severity: warning
          aira_signal: memory
        annotations:
          summary: "Memory growing on {{ $labels.service_name }}"
          description: "{{ $labels.service_name }} is using {{ $value | printf \"%.1f\" }}x the memory it used 15 minutes ago, and is above 60% of its container limit."
