# AIRA Alertmanager configuration.
# Every alert is forwarded as a webhook to the AIRA backend (FastAPI) running on the host.
global:
  resolve_timeout: 2m

route:
  receiver: aira-backend
  # One notification group per alert/service so each becomes its own AIRA incident.
  group_by: ['alertname', 'service_name']
  # Short waits so incidents appear quickly during a live demo.
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 30m

receivers:
  - name: aira-backend
    webhook_configs:
      - url: http://host.docker.internal:8000/alerts
        send_resolved: true
        max_alerts: 0
