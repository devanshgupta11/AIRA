<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161D">
<meta name="color-scheme" content="dark">
<meta name="description" content="AIRA incident response: incidents, investigations and remediation approval.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AIRA">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>AIRA</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" type="image/png" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app/app.css">
<script type="module" src="/app/js/app.js"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="icon-btn back" id="back" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="brand" id="brand"><b>AIRA</b></div>
    <h1 class="title" id="title"></h1>
    <button class="conn" id="conn" type="button" aria-live="polite" title="Connection"><i></i><span>connecting</span></button>
    <button class="icon-btn" id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
    </button>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <main class="view" id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>
      <span>Dashboard</span></a>
    <a href="#/incidents" data-tab="incidents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 16H3zM12 10v4M12 17h.01"/></svg>
      <span>Incidents</span></a>
    <a href="#/approvals" data-tab="approvals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10M5 20h14"/></svg>
      <span>Approvals</span><b class="count" id="badge-approvals" hidden></b></a>
    <a href="#/activity" data-tab="activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8M10 20a2 2 0 0 0 4 0"/></svg>
      <span>Activity</span><b class="count pip" id="badge-activity" hidden></b></a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L10 21h4l.5-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
      <span>Settings</span></a>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:24px;color:#F3F6FA">AIRA needs JavaScript.</p></noscript>
</body>
</html>
